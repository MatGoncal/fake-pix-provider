services:
  fake-pix:
    build: .
    image: fake-pix-provider:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FORWARD_FAKE_PIX_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      FAKE_PIX_API_KEY: ${FAKE_PIX_API_KEY:-fake-pix-demo}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
